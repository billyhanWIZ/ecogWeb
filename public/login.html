<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 — eco.G 텀블러 세척기 모니터링</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="theme-color" content="#134226">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
  <link rel="stylesheet" href="/v/__V__/css/app.css">
</head>
<body>
  <div class="login">
    <section class="art" aria-label="eco.G 텀블러 세척기">
      <h1>씻어 쓴 텀블러 한 번이 일회용컵 하나를 줄입니다</h1>
      <p>설치한 세척기가 몇 번 쓰였고 탄소를 얼마나 줄였는지 한 화면에서 확인하세요.</p>
    </section>
    <section class="form">
      <form id="f" autocomplete="on">
        <img src="/img/ecog-logo.png" alt="eco.G">
        <div class="field">
          <label for="id">아이디</label>
          <input id="id" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="pw">비밀번호</label>
          <input id="pw" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="err" class="err hidden" role="alert"></p>
        <button class="btn primary" style="width:100%;justify-content:center;padding:10px" type="submit">로그인</button>
        <p class="faint" style="font-size:13px;margin-top:18px">비밀번호를 잊으셨으면 관리자에게 초기화를 요청하세요.</p>
      </form>
    </section>
  </div>
  <script type="module" src="/v/__V__/js/login.js"></script>
</body>
</html>
