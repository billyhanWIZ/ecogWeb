<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#134226">
  <meta name="ecog-version" content="__V__">
  <title>eco.G 텀블러 세척기</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="manifest" href="/tablet.webmanifest">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
  <link rel="stylesheet" href="/v/__V__/css/tablet.css">
  <script type="module" src="/v/__V__/js/tablet/main.js"></script>
</head>
<body>
  <!-- 처음: 태블릿 등록 -->
  <section id="reg" class="screen reg" hidden>
    <img class="logo" src="/img/ecog-logo-white.png" alt="eco.G">
    <h1>태블릿 등록</h1>
    <p>관리자 화면 › 장비 › 세척기 상세의 <b>태블릿 등록 코드</b> 8자리를 넣으세요.</p>
    <output id="code" class="code" aria-live="polite"></output>
    <div id="pad" class="pad"></div>
    <button id="regBtn" class="btn big" type="button" disabled>등록</button>
    <p id="regErr" class="err" role="alert"></p>
  </section>

  <!-- 평소 화면 -->
  <main id="main" class="screen main" hidden>
    <header class="top">
      <img id="brand" class="brand" src="/img/ecog-logo-white.png" alt="eco.G">
      <img id="custLogo" class="cust" alt="" hidden>
      <div class="where"><b id="name"></b><span id="site"></span></div>
      <div class="clock"><time id="clock"></time><div id="wx" class="wx" hidden></div></div>
    </header>
    <section class="hero">
      <p class="lead">이 세척기로 지금까지</p>
      <p class="big"><span id="total">–</span><small>번 씻었어요</small></p>
      <p class="sub">일회용컵 <b id="cups">–</b>개를 쓰지 않은 셈입니다</p>
    </section>
    <section class="cards">
      <div class="card"><span>오늘</span><b id="today">–</b><small>번 세척</small></div>
      <div class="card"><span>줄인 탄소</span><b id="co2">–</b><small id="co2u">kg CO₂</small></div>
      <div class="card tree">
        <svg viewBox="0 0 44 44" class="ring" aria-hidden="true"><circle cx="22" cy="22" r="19" class="bg"/><circle id="ring" cx="22" cy="22" r="19" class="fg"/><path d="M22 11l-7 10h4l-5 7h6v5h4v-5h6l-5-7h4z" class="pine"/></svg>
        <div><span>소나무 1년 흡수량</span><b id="trees">–</b><small id="treeNext">그루</small></div>
      </div>
    </section>
    <footer class="bottom">
      <img src="/tablet/machine.png" alt="">
      <span>텀블러를 세척기 가운데에 올려 주세요</span>
      <span class="chips"><i id="chipBle" class="chip">세척기</i><i id="chipNet" class="chip">인터넷</i></span>
    </footer>
    <div id="banner" class="banner" role="status" hidden></div>
  </main>

  <!-- 세척기 연결 -->
  <section id="conn" class="screen conn" hidden>
    <img class="logo" src="/img/ecog-logo-white.png" alt="eco.G">
    <img class="machine" src="/tablet/machine.png" alt="">
    <h1 id="connTitle">세척기에 연결하는 중</h1>
    <p id="connMsg"></p>
    <button id="connBtn" class="btn big" type="button" hidden>터치하여 세척기 연결</button>
  </section>

  <!-- 세척 중 -->
  <section id="clean" class="screen clean" hidden>
    <video id="video" src="/tablet/clean.mp4" poster="/tablet/clean-poster.jpg" playsinline preload="auto"></video>
  </section>

  <!-- 세척 끝 -->
  <section id="done" class="screen done" hidden>
    <div id="plus" class="plus">+1</div>
    <p id="doneMsg" class="msg"></p>
    <p id="doneSub" class="sub"></p>
  </section>

  <!-- 설정: 왼쪽 위 로고를 3초 안에 5번 누르면 열린다 (한 번만 누르면 종료 확인) -->
  <dialog id="settings" class="settings">
    <h2>태블릿 설정</h2>
    <dl id="info"></dl>
    <div class="row">
      <button id="sReconnect" class="btn" type="button">세척기 다시 연결</button>
      <button id="sChoose" class="btn" type="button">가장 가까운 세척기 다시 찾기</button>
      <button id="sReload" class="btn" type="button">화면 새로 고침</button>
      <button id="sSystem" class="btn" type="button" hidden>안드로이드 설정</button>
    </div>
    <div class="row">
      <button id="sReset" class="btn danger hold" type="button">등록 해제 (3초 누르기)</button>
      <button id="sExit" class="btn" type="button">앱 종료</button>
      <span class="grow"></span>
      <button id="sClose" class="btn primary" type="button">닫기</button>
    </div>
  </dialog>

  <!-- 종료: 왼쪽 위 로고를 한 번 누르면 묻는다 -->
  <dialog id="exitDlg" class="exit">
    <h2>앱을 종료할까요?</h2>
    <p id="exitMsg">종료하면 세척 횟수를 세지 않습니다.</p>
    <div class="row">
      <button id="exitNo" class="btn" type="button">취소</button>
      <button id="exitYes" class="btn primary" type="button">종료</button>
    </div>
  </dialog>

  <div id="simbar" class="simbar" hidden></div>
  <audio id="ding" src="/tablet/done.mp3" preload="auto"></audio>
</body>
</html>
