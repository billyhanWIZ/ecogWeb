<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eco.G 텀블러 세척기 모니터링</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="theme-color" content="#134226">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/vendor/echarts.min.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <img id="logo" src="/img/ecog-logo-white.png" alt="eco.G">
        <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="nav">
          <svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true"><path d="M0 1h18M0 7h18M0 13h18" stroke="currentColor" stroke-width="2"/></svg>메뉴
        </button>
      </div>
      <nav id="nav" aria-label="메뉴">
        <a href="#/dashboard" data-page="dashboard">대시보드</a>
        <a href="#/stats" data-page="stats">통계</a>
        <a href="#/devices" data-page="devices">장비 <span class="badge hidden" id="badge-off"></span></a>
        <a href="#/reports" data-page="reports">리포트</a>
        <div class="sep" data-admin></div>
        <a href="#/orgs" data-page="orgs" data-admin>조직</a>
        <a href="#/users" data-page="users" data-admin>사용자</a>
        <a href="#/settings" data-page="settings" data-sys>설정</a>
      </nav>
      <div class="me">
        <b id="me-name"></b>
        <span id="me-role" class="faint"></span>
        <div class="links">
          <button id="btn-pw" type="button">비밀번호 변경</button>
          <button id="btn-logout" type="button">로그아웃</button>
        </div>
      </div>
    </aside>
    <main class="main" id="view" tabindex="-1"><div class="loading">불러오는 중…</div></main>
  </div>
</body>
</html>
